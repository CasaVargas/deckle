# cargo nextest: every test in its own process, test binaries in parallel.
# Locally: `cargo nextest run --workspace`, or `-p <crate>` for one crate.

[profile.default]
# Report every failure, not just the first.
fail-fast = false
# A test that hangs is flagged after 60 s and killed after 3 minutes.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
# Repeat the failures at the end of the log so they're easy to find.
final-status-level = "fail"
