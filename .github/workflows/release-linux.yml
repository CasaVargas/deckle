name: release-linux
# Linux half of a release: the headless CLI as tarballs (x86_64, aarch64) attached to the
# release's draft, and the multi-arch container image pushed to GHCR (docs/superpowers/specs/
# 2026-10-29-linux-docker-design.md). release.yml calls this with the tag and dry-run flag it
# works out itself; it can also be run alone with workflow_dispatch (dry run, or a tag whose
# draft release already exists).
#
# `:latest` is not moved at tag time: release.yml makes a draft, and the owner reviews it first.
# Publishing the release (the `release: published` trigger) points `:latest` at that version's
# existing image, with no rebuild.
#
# A dry run builds everything, smokes the image and keeps the tarballs as workflow artifacts;
# it creates no release asset and pushes no image.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.0); empty for a dry run"
        type: string
        default: ""
      dry_run:
        description: "Build and check without attaching assets or pushing the image"
        type: boolean
        default: false
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.9.0); leave empty for a dry run"
        type: string
        default: ""
      dry_run:
        description: "Build and check without attaching assets or pushing the image"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  linux-cli:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 runners set the glibc floor (2.35: Ubuntu 22.04, Debian 12 or newer)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            pdfium: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}
      - name: Dry run or tag
        run: |
          if [ -z "$TAG" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Run by hand with no tag: set dry_run to build without a release."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # keyring's Secret Service backend links libdbus; the CLI needs nothing else.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --release -p deckle-cli --locked
      - name: Package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          PDFIUM: ${{ matrix.pdfium }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          fi
          tools/fetch-pdfium.sh "$PDFIUM"
          name="deckle-$version-$TARGET"
          mkdir "$name"
          cp target/release/deckle target/pdfium/lib/libpdfium.so LICENSE "$name/"
          # deckle-pdf looks for PDFium beside the executable, so no setup is needed.
          printf '%s\n' \
            "Needs glibc 2.35+ (Ubuntu 22.04, Debian 12 or newer) and libdbus-1-3." \
            "PDFium (libpdfium.so) sits beside deckle and is found there; set DECKLE_PDFIUM to a library file or folder to use another copy." \
            > "$name/README.txt"
          tar czf "$name.tar.gz" "$name"
          echo "tarball=$name.tar.gz" >> "$GITHUB_OUTPUT"
      # The tarball as shipped must run on its own: the binary starts and reads a PDF through
      # the libpdfium.so beside it (the runner is the target architecture, so this executes).
      - name: Check the tarball
        env:
          TARBALL: ${{ steps.pkg.outputs.tarball }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          tar xzf "$TARBALL" -C "$dir"
          bin=$(ls -d "$dir"/*/)deckle
          "$bin" --version
          out=$("$bin" --json inspect fixtures/pdf/book.pdf)
          echo "$out"
          echo "$out" | grep -q '"title": *"A Small Book"' || { echo "::error::the tarball's deckle couldn't read a PDF through its libpdfium.so"; exit 1; }
      # The draft release is made by release.yml's bundle jobs, which this runs after.
      - name: Attach to the release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pkg.outputs.tarball }}
        run: gh release upload "$TAG" "$TARBALL" --clobber -R "$GITHUB_REPOSITORY"
      - name: Keep the dry run's tarball
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: deckle-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.tarball }}
          retention-days: 7

  # Each architecture is built natively (an arm64 build under QEMU takes over an hour), smoked
  # before anything is pushed, and pushed by digest; `image` then joins the digests into one
  # multi-arch tag. A real release never publishes an image that failed its smoke test.
  image-build:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}
      - name: Dry run or tag
        run: |
          if [ -z "$TAG" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Run by hand with no tag: set dry_run to build without a release."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      # Loaded locally, so the smoke test runs before anything is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: deckle:smoke
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - run: tools/docker-smoke.sh deckle:smoke
      - name: Log in to GHCR
        if: inputs.dry_run != true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same build again, from the cache, pushed by digest only (no tag yet).
      - name: Push by digest
        if: inputs.dry_run != true
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/casavargas/deckle,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Export the digest
        if: inputs.dry_run != true
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Keep the digest
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: image-build
    if: github.event_name != 'release' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version is the tag without its leading v (0.9.0 style); `:latest` waits for publish.
      - name: Join the architectures into one tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          version="${TAG#v}"
          refs=()
          for d in *; do refs+=("ghcr.io/casavargas/deckle@sha256:$d"); done
          docker buildx imagetools create \
            -t "ghcr.io/casavargas/deckle:$version" \
            "${refs[@]}"
          docker buildx imagetools inspect "ghcr.io/casavargas/deckle:$version"

  # The owner published the draft: `:latest` now follows that version (no rebuild). Prereleases
  # never take it. Runs only for the `release` event, never for workflow_call or dispatch.
  latest:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the published version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          docker buildx imagetools create -t ghcr.io/casavargas/deckle:latest "ghcr.io/casavargas/deckle:$version"
          docker buildx imagetools inspect ghcr.io/casavargas/deckle:latest
