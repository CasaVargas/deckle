name: ci
# Branch pushes are covered by their pull request; a push to main checks the merged result.
on:
  push:
    branches: [main]
  pull_request:
# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Which parts a pull request touches. A job it doesn't touch is skipped, and a skipped job
  # counts as passed for required checks. A push to main runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'data/**'
              - 'fixtures/**'
              - 'docs/formats/**'
              - 'docs/superpowers/specs/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.config/nextest.toml'
              - '.gitattributes'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/*.json'
              - 'apps/desktop/*.ts'
              - 'apps/desktop/*.yaml'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - 'crates/**'
              - 'data/**'
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/*.json'
              - 'apps/desktop/*.ts'
              - 'apps/desktop/*.yaml'
              - 'tools/docker-smoke.sh'
              - 'tools/fetch-pdfium.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'LICENSE'
              - '.github/workflows/ci.yml'
  rust:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The workspace includes the Tauri app, which links WebKitGTK and friends on Linux.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libdbus-1-dev pkg-config luajit
      # KOReader's own calibre client, run against the wireless server (calibre bridge §8).
      - if: runner.os == 'Linux'
        run: |
          tools/fetch-koreader-calibre.sh
          echo "DECKLE_REQUIRE_KOREADER=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The PDF importer's tests read real PDFs through PDFium (pinned and checksummed).
      - run: tools/fetch-pdfium.sh
        shell: bash
      # nextest runs every test in its own process and the test binaries in parallel (cargo
      # test runs the binaries one after another). The workspace has no doctests to miss.
      - run: cargo nextest run --workspace --profile ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-press.txt
      - run: python tools/press-smoke.py --target-dir target --output "${{ runner.temp }}/press-smoke"
  # The headless image (docker/Dockerfile): build it for amd64, run one daemon tick in it and
  # log in to its web UI.
  docker:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t deckle:ci .
      - name: Image size and linked libraries
        run: |
          docker image ls deckle:ci
          docker run --rm --entrypoint ldd deckle:ci /opt/deckle/deckle
      - run: tools/docker-smoke.sh deckle:ci
  # The Deckle plugin for KOReader is Lua: its logic is tested, and every file compiled, on the
  # LuaJIT KOReader runs on (KOReader plugins design §9).
  koplugin:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luajit crates/deckle-core/koplugin/tests/logic_test.lua
      - run: for f in crates/deckle-core/koplugin/deckle.koplugin/*.lua crates/deckle-core/koplugin/tests/*.lua; do luajit -b "$f" /dev/null || exit 1; done
  # The calibre write-back against calibre's own calibredb (calibre bridge design §8).
  calibre:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # calibre's own Linux installer (the current release), as calibre's site gives it.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xdg-utils xz-utils libegl1 libopengl0 libxcb-cursor0 libxkbcommon0 libglx0 libnss3
          wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin
          calibredb --version
      - run: cargo nextest run -p deckle-library -E 'test(real_calibredb)'
        env:
          DECKLE_REQUIRE_CALIBRE: "1"
          QT_QPA_PLATFORM: offscreen
  press-contract:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv-press
      - run: .venv-press/bin/python -m pip install -r tools/requirements-press.txt
      - run: .venv-press/bin/python tools/validate-press-fixtures.py
  # The release installs the frontend with a frozen lockfile; do the same here so a pnpm
  # problem fails the pull request, not the release.
  frontend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
