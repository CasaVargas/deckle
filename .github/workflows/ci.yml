name: ci
# Branch pushes are covered by their pull request; a push to main checks the merged result.
on:
  push:
    branches: [main]
  pull_request:
# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Every job runs on the org's self-hosted runners (a Mac, a Windows PC and a Linux box).
# They are persistent and shared with other repos' builds: GitHub-hosted macOS and
# Windows minutes were most of the org's Actions bill.
jobs:
  # Which parts a pull request touches. A job it doesn't touch is skipped, and a skipped job
  # counts as passed for required checks. A push to main runs everything.
  changes:
    runs-on: [self-hosted, Linux]
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'data/**'
              - 'fixtures/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.gitattributes'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/*.json'
              - 'apps/desktop/*.ts'
              - 'apps/desktop/*.yaml'
              - '.github/workflows/ci.yml'
  rust:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: [self-hosted, macOS]
          - os: windows
            runner: [self-hosted, Windows]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The PDF importer's tests read real PDFs through PDFium (pinned and checksummed).
      - run: tools/fetch-pdfium.sh
        shell: bash
      - run: cargo test --workspace --no-fail-fast
  # The release installs the frontend with a frozen lockfile; do the same here so a pnpm
  # problem fails the pull request, not the release.
  frontend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, Linux]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
