name: release
# Builds installers for a `v*` tag and attaches them to a DRAFT GitHub release; the owner
# reviews and publishes it. macOS builds are signed and notarized when the Apple secrets exist
# (docs/release.md), ad-hoc signed otherwise. Windows ships unsigned in v1 (design §12).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # Only export the Apple variables when the secrets are set: an empty APPLE_CERTIFICATE
      # would make the bundler try (and fail) to import a certificate.
      - name: Apple signing and notarization (when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
            echo "Signing with the Developer ID certificate and notarizing."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::No Apple secrets: the macOS build is ad-hoc signed and not notarized."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ env.TAG }}
          releaseName: Deckle ${{ env.TAG }}
          releaseBody: |
            See CHANGELOG.md for what changed and README.md for install notes.
            macOS: if the app is not notarized, right-click → Open the first time.
            Windows: unsigned in v1; SmartScreen → More info → Run anyway.
            Requires Kindle Previewer 4 (free, from Amazon).
          releaseDraft: true
          prerelease: true
