name: release
# Builds installers for a `v*` tag and attaches them to a DRAFT GitHub release; the owner
# reviews and publishes it. It runs only for a version tag or by hand (workflow_dispatch):
# pull requests are checked by ci.yml and don't build installers. macOS builds are signed and
# notarized when the Apple secrets exist, and Windows builds are signed with Azure Artifact
# Signing when the Azure secrets exist (docs/release.md); without them each platform builds
# unsigned with a warning. Updater bundles are always signed with TAURI_SIGNING_PRIVATE_KEY, and
# the release's latest.json is what installed copies read once the draft is published.
#
# A dry run (workflow_dispatch with dry_run, on any branch, no tag) builds, signs, notarizes and
# checks exactly as a release does, but keeps the bundles as workflow artifacts and creates no
# release, so nothing can reach installed copies (docs/release.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0); leave empty for a dry run"
        required: false
      dry_run:
        description: "Build, sign and check the branch without creating a release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            pdfium: mac-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            pdfium: mac-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
    runs-on: ${{ matrix.os }}
    env:
      # the pushed tag, or the one given to a manual run
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # No key, no release: unsigned updater bundles would publish a latest.json no install can verify.
      - name: Updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: updater bundles can't be signed (docs/release.md)."
            exit 1
          fi
      # Only export the Apple variables when the secrets are set: an empty APPLE_CERTIFICATE
      # would make the bundler try (and fail) to import a certificate.
      - name: Apple signing and notarization (when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
            echo "Signing with the Developer ID certificate and notarizing."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::No Apple secrets: the macOS build is ad-hoc signed and not notarized."
          fi
      # Windows: Azure Artifact Signing (account casavargas, profile casavargas-public-trust, the
      # same setup as Beltr and DebridDownloader). Tauri's signCommand
      # (src-tauri/windows/tauri.signing.conf.json, passed below only when this step enables it)
      # runs src-tauri/windows/sign.ps1 on the app exe and the NSIS installer and uninstaller.
      # This step fetches the signing dlib, finds signtool, and signs a throwaway exe
      # through the same script, so a bad secret, a missing signer role or a wrong endpoint fails
      # here, readably, instead of deep inside the bundler.
      - name: Azure Artifact Signing (when configured)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'  # Windows PowerShell's progress bar crawls downloads
          $missing = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET' |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            Write-Host "::warning::No Azure signing secrets ($($missing -join ', ')): the Windows build is unsigned."
            exit 0
          }
          # The dlib is .NET 8 code hosted inside signtool (rollForward: Major). Without an x64
          # .NET 8+ runtime, signtool exits 3 and prints nothing at all.
          $netcore = Join-Path $env:ProgramFiles 'dotnet\shared\Microsoft.NETCore.App'
          $runtimes = Get-ChildItem $netcore -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+' -and [int]$Matches[0] -ge 8 }
          if (-not $runtimes) {
            Write-Host "::error::No x64 .NET 8+ runtime on this runner; Azure Artifact Signing needs one."
            exit 1
          }
          # Pinned, hash-checked Artifact Signing client (the signtool dlib).
          $version = '1.0.128'
          $sha256 = '74BD7D27E6CE1051409C38D9B46BC8DF0400ECD643D51FFBF2AC00869061E40B'
          $dir = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          $pkg = Join-Path $dir "Microsoft.ArtifactSigning.Client.$version.zip"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/$version" -OutFile $pkg -UseBasicParsing
          $actual = (Get-FileHash $pkg -Algorithm SHA256).Hash
          if ($actual -ne $sha256) {
            Write-Host "::error::Microsoft.ArtifactSigning.Client $version hash mismatch: got $actual"
            exit 1
          }
          Expand-Archive $pkg (Join-Path $dir 'client') -Force
          $dlib = Join-Path $dir 'client\bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) {
            Write-Host "::error::$dlib is missing from the Artifact Signing client package"
            exit 1
          }
          # Newest Windows SDK signtool; Artifact Signing needs 10.0.22621.755 or later.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool -or [version]$signtool.Directory.Parent.Name -lt [version]'10.0.22621.0') {
            Write-Host "::error::No Windows SDK signtool 10.0.22621 or later on this runner"
            exit 1
          }
          Write-Host "signtool: $($signtool.FullName)"
          Write-Host "dlib: $dlib"
          # Add-Content, not Out-File -Encoding utf8: Windows PowerShell would write a BOM.
          Add-Content $env:GITHUB_ENV "SIGNTOOL_PATH=$($signtool.FullName)"
          Add-Content $env:GITHUB_ENV "ARTIFACT_SIGNING_DLIB=$dlib"
          $env:SIGNTOOL_PATH = $signtool.FullName
          $env:ARTIFACT_SIGNING_DLIB = $dlib
          # A throwaway exe of our own, so the probe never signs anything that ships.
          $probe = Join-Path $env:RUNNER_TEMP 'signing-probe.exe'
          Add-Type -TypeDefinition 'public static class Probe { public static void Main() {} }' -OutputAssembly $probe -OutputType ConsoleApplication
          # signtool writes errors to stderr; under 'Stop' Windows PowerShell would abort on the
          # first line instead of reaching the explanation below.
          $ErrorActionPreference = 'Continue'
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps\desktop\src-tauri\windows\sign.ps1 $probe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Azure Artifact Signing failed (signtool exit $LASTEXITCODE, output above). A 403 means the Entra app lacks the Artifact Signing Certificate Profile Signer role on the casavargas account."
            exit 1
          }
          $sig = Get-AuthenticodeSignature $probe
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::Signing probe came back '$($sig.Status)': $($sig.StatusMessage)"
            exit 1
          }
          # Artifact Signing certificates live for days; without a timestamp every signature
          # would stop validating soon after release.
          if (-not $sig.TimeStamperCertificate) {
            Write-Host "::error::Signing probe has no timestamp"
            exit 1
          }
          Write-Host "Signing works. Signer: $($sig.SignerCertificate.Subject)"
          Add-Content $env:GITHUB_ENV "WINDOWS_SIGN_ARGS= --config src-tauri/windows/tauri.signing.conf.json"
      # PDFium ships inside the app for PDF import: in Contents/Frameworks on macOS (signed with
      # the app), beside Deckle.exe on Windows (PDF spec §8).
      - name: PDFium
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TAG" ] && [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "::error::Run by hand with no tag: set dry_run to build without a release."
            exit 1
          fi
          tools/fetch-pdfium.sh ${{ matrix.pdfium }}
          mkdir -p apps/desktop/src-tauri/pdfium
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/pdfium/bin/pdfium.dll apps/desktop/src-tauri/pdfium/
            echo "PDFIUM_ARGS= --config src-tauri/pdfium.windows.conf.json" >> "$GITHUB_ENV"
          else
            cp target/pdfium/lib/libpdfium.dylib apps/desktop/src-tauri/pdfium/
            echo "PDFIUM_ARGS= --config src-tauri/pdfium.macos.conf.json" >> "$GITHUB_ENV"
          fi
          # A release build must find the bundled copy, not this one.
          rm -rf target/pdfium
      # macOS 26 draws the Liquid Glass icon from Resources/Assets.car, which Xcode 26's actool
      # compiles from src-tauri/icons/Deckle.icon; CFBundleIconName (src-tauri/icon.macos.Info.plist)
      # names it. icons/icon.icns stays as CFBundleIconFile for anything that doesn't read Assets.car.
      - name: Liquid Glass icon
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          # actool learned .icon in Xcode 26; use the runner's default Xcode if it's new enough,
          # else the newest Xcode 26 or later installed beside it.
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 26 ]; then
            xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
            [ -n "$xcode" ] || { echo "::error::No Xcode 26 or later on this runner to compile icons/Deckle.icon"; exit 1; }
            export DEVELOPER_DIR="$xcode/Contents/Developer"
          fi
          xcrun actool --version
          mkdir -p liquid-glass
          xcrun actool icons/Deckle.icon --compile liquid-glass \
            --output-format human-readable-text --notices --warnings --errors \
            --output-partial-info-plist "$RUNNER_TEMP/icon-partial.plist" \
            --app-icon Deckle --include-all-app-icons --enable-on-demand-resources NO \
            --development-region en --target-device mac \
            --minimum-deployment-target 14.0 --platform macosx
          test -f liquid-glass/Assets.car || { echo "::error::actool made no Assets.car from icons/Deckle.icon"; exit 1; }
          echo "actool's partial Info.plist:"
          cat "$RUNNER_TEMP/icon-partial.plist"
          xcrun --sdk macosx assetutil --info liquid-glass/Assets.car
          echo "ICON_ARGS= --config src-tauri/icon.macos.conf.json" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        if: github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # read by src-tauri/windows/sign.ps1 when the step above enabled signing
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}${{ env.WINDOWS_SIGN_ARGS }}${{ env.PDFIUM_ARGS }}${{ env.ICON_ARGS }}
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG && format('Deckle {0}', env.TAG) || '' }}
          releaseBody: |
            See CHANGELOG.md for what changed and README.md for install notes.
            Updating from 0.2.x? Install this version once by hand; later versions update from inside Deckle (Settings → About). Windows: if you used the .msi, uninstall it first.
            macOS: signed with a Developer ID and notarized by Apple.
            Windows: code-signed by Casa Vargas LLC (Azure Artifact Signing).
            Requires Kindle Previewer 4 (free, from Amazon).
          releaseDraft: true
          prerelease: false
      - name: Build (dry run, no release)
        if: github.event.inputs.dry_run == 'true'
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: pnpm tauri build --target ${{ matrix.target }}${{ env.WINDOWS_SIGN_ARGS }}${{ env.PDFIUM_ARGS }}${{ env.ICON_ARGS }}
      # The built app reads a PDF through its own PDFium: no DECKLE_PDFIUM, no copy elsewhere.
      - name: Check PDFium in the macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app=$(ls -d target/$TARGET/release/bundle/macos/*.app | head -1)
          test -f "$app/Contents/Frameworks/libpdfium.dylib" || { echo "::error::libpdfium.dylib is not in $app/Contents/Frameworks"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app/Contents/Frameworks/libpdfium.dylib" 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true
          if [ "${APPLE_SIGNING_IDENTITY:-}" != "-" ]; then
            spctl -a -vv "$app"
          fi
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          if [ "$TARGET" = "x86_64-apple-darwin" ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::notice::No Rosetta on this runner: the x86_64 app's PDF read is checked on arm64 only."
            exit 0
          fi
          out=$("$bin" --json inspect fixtures/pdf/book.pdf)
          echo "$out"
          echo "$out" | grep -q '"title": *"A Small Book"' || { echo "::error::the app couldn't read a PDF through its bundled PDFium"; exit 1; }
      - name: Check the Liquid Glass icon in the macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app=$(ls -d target/$TARGET/release/bundle/macos/*.app | head -1)
          test -f "$app/Contents/Resources/Assets.car" || { echo "::error::Assets.car is not in $app/Contents/Resources"; exit 1; }
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")
          [ "$name" = "Deckle" ] || { echo "::error::CFBundleIconName is '$name', not Deckle"; exit 1; }
          echo "CFBundleIconFile: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")"
          ls -l "$app/Contents/Resources"
      - name: Check PDFium in the Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem "target\$env:TARGET\release\bundle\nsis" -Filter *-setup.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'pdfium-check'
          $7z = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $7z) { $7z = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          & $7z x $setup.FullName "-o$out" -y | Out-Null
          $dll = Get-ChildItem $out -Recurse -Filter pdfium.dll | Select-Object -First 1
          $app = Get-ChildItem $out -Recurse -Filter *.exe | Where-Object { $_.Name -in 'Deckle.exe', 'deckle-desktop.exe' } | Select-Object -First 1
          if (-not $dll -or -not $app) { Write-Host "::error::pdfium.dll or the app exe is missing from $($setup.Name)"; exit 1 }
          if ($dll.DirectoryName -ne $app.DirectoryName) { Write-Host "::error::pdfium.dll is in $($dll.DirectoryName), not beside $($app.Name)"; exit 1 }
          Write-Host "(info) pdfium.dll signature: $((Get-AuthenticodeSignature $dll.FullName).Status)"
          $json = Join-Path $env:RUNNER_TEMP 'inspect.json'
          $p = Start-Process -FilePath $app.FullName -ArgumentList '--json', 'inspect', (Resolve-Path 'fixtures\pdf\book.pdf') -RedirectStandardOutput $json -RedirectStandardError "$json.err" -Wait -PassThru -NoNewWindow
          Get-Content $json, "$json.err"
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path $json -Pattern '"title": *"A Small Book"' -Quiet)) {
            Write-Host "::error::the app couldn't read a PDF through its bundled PDFium"
            exit 1
          }
      - name: Keep the dry run's bundles
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deckle-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          retention-days: 7
      # The installer, and the app exe packed inside it, must carry a valid,
      # timestamped signature. The loose target\...\release exe doesn't count: after each package
      # step the bundler puts the unsigned binary back, so only the packaged copies are signed.
      # Other files in the NSIS payload (stock NSIS plugins, the 7-Zip-rebuilt uninstall.exe) are
      # reported, not enforced; see DebridDownloader's workflow for why.
      - name: Verify Windows signatures
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_ARGS
        shell: powershell
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $bundle = "target\$env:TARGET\release\bundle"
          $bad = 0
          function Test-Signed([string]$Path) {
            $sig = Get-AuthenticodeSignature $Path
            if ($sig.Status -eq 'Valid' -and $sig.TimeStamperCertificate) {
              Write-Host "OK  $Path : $($sig.SignerCertificate.Subject)"
              return $true
            }
            Write-Host "::error::$Path is not validly signed and timestamped: $($sig.Status) $($sig.StatusMessage)"
            return $false
          }
          foreach ($f in Get-ChildItem $bundle -Recurse -Include *.exe) {
            if (-not (Test-Signed $f.FullName)) { $bad++ }
          }
          $7z = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $7z) { $7z = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          foreach ($setup in Get-ChildItem "$bundle\nsis" -Filter *-setup.exe) {
            $out = Join-Path $env:RUNNER_TEMP "unpacked-$($setup.BaseName)"
            & $7z x $setup.FullName "-o$out" -y | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::7-Zip could not unpack $($setup.Name)"
              $bad++
              continue
            }
            # the app exe is Deckle.exe (productName) or deckle-desktop.exe (crate name)
            $app = Get-ChildItem $out -Filter *.exe | Where-Object { $_.Name -in 'Deckle.exe', 'deckle-desktop.exe' }
            if (-not $app) {
              Write-Host "::error::The app exe was not found inside $($setup.Name)"
              $bad++
            }
            foreach ($f in Get-ChildItem $out -Recurse -Include *.exe, *.dll) {
              if ($app -and $f.FullName -eq $app[0].FullName) {
                if (-not (Test-Signed $f.FullName)) { $bad++ }
              } else {
                Write-Host "(info) $($f.Name) inside $($setup.Name): $((Get-AuthenticodeSignature $f.FullName).Status)"
              }
            }
          }
          if ($bad) { exit 1 }

  # Every platform's updater entry must be in the draft's latest.json before it's published:
  # an install whose key is missing finds no update.
  check-updater-json:
    needs: bundle
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ (github.event.inputs.tag || startsWith(github.ref, 'refs/tags/')) && github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Check latest.json
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json -D "$RUNNER_TEMP"
          json="$RUNNER_TEMP/latest.json"
          cat "$json"
          bad=0
          for key in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            if ! jq -e --arg k "$key" --arg t "/download/$TAG/" \
              '.platforms[$k] | (.signature | length > 0) and (.url | contains($t))' "$json" >/dev/null; then
              echo "::error::latest.json lacks a signed $key entry for $TAG"
              bad=1
            fi
          done
          exit $bad
