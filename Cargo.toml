[workspace]
resolver = "3"
members = ["crates/*", "data/wordwise", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/CasaVargas/deckle"
rust-version = "1.89"

[workspace.dependencies]
deckle-kfx = { path = "crates/deckle-kfx" }
deckle-core = { path = "crates/deckle-core" }
deckle-transport = { path = "crates/deckle-transport" }
deckle-xray = { path = "crates/deckle-xray" }
deckle-wordwise = { path = "crates/deckle-wordwise" }
deckle-digest = { path = "crates/deckle-digest" }
deckle-cli = { path = "crates/deckle-cli" }
deckle-docx = { path = "crates/deckle-docx" }
deckle-markdown = { path = "crates/deckle-markdown" }
deckle-txt = { path = "crates/deckle-txt" }
deckle-fb2 = { path = "crates/deckle-fb2" }
deckle-odt = { path = "crates/deckle-odt" }
deckle-rtf = { path = "crates/deckle-rtf" }
deckle-pdf = { path = "crates/deckle-pdf" }
deckle-library = { path = "crates/deckle-library" }
deckle-readership = { path = "crates/deckle-readership" }
deckle-cover = { path = "crates/deckle-cover" }
deckle-highlights = { path = "crates/deckle-highlights" }
deckle-shelf = { path = "crates/deckle-shelf" }
deckle-morgue = { path = "crates/deckle-morgue" }
deckle-mobi = { path = "crates/deckle-mobi" }
deckle-app = { path = "crates/deckle-app" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
csv = "1"
tempfile = "3"
sha1 = "0.11"
rand = "0.9"
deunicode = "1"
regex = "1"
ureq = { version = "3", features = ["platform-verifier", "cookies", "json"] }
base64 = "0.22"
sha2 = "0.11"
md-5 = "0.11"
encoding_rs = "0.8"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
uuid = { version = "1", features = ["v4"] }
assert_cmd = "2"
predicates = "3"
# deckle-server: the web UI.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false }
subtle = "2"
getrandom = "0.3"

# Our own crates keep line tables only: backtraces still name files and lines, and linking is
# far faster than with full debug info. Dependencies build without any.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
