[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/prjoni99/deckle"
rust-version = "1.85"

[workspace.dependencies]
deckle-kfx = { path = "crates/deckle-kfx" }
deckle-core = { path = "crates/deckle-core" }
deckle-transport = { path = "crates/deckle-transport" }
deckle-xray = { path = "crates/deckle-xray" }
deckle-wordwise = { path = "crates/deckle-wordwise" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
csv = "1"
tempfile = "3"
sha1 = "0.11"
rand = "0.9"
deunicode = "1"
regex = "1"
ureq = "3"
base64 = "0.22"
sha2 = "0.11"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
uuid = { version = "1", features = ["v4"] }
assert_cmd = "2"
predicates = "3"
