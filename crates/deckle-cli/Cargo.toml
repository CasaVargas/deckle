[package]
name = "deckle-cli"
description = "Deckle command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "deckle"
path = "src/main.rs"

[dependencies]
deckle-core.workspace = true
deckle-kfx.workspace = true
deckle-transport.workspace = true
deckle-xray.workspace = true
deckle-digest.workspace = true
deckle-library.workspace = true
deckle-highlights.workspace = true
deckle-readership.workspace = true
deckle-shelf.workspace = true
deckle-morgue.workspace = true
deckle-readerserver.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
deckle-comic.workspace = true
# `digest email password`: the SMTP password, read without echo.
rpassword = "7"
# `digest daemon`: SIGTERM/SIGINT stop it cleanly in a container.
signal-hook = "0.3"

[target.'cfg(unix)'.dependencies]
# `digest daemon` passes SIGTERM on to its children.
libc = "0.2"

[dev-dependencies]
sha2.workspace = true
deckle-mobi.workspace = true
zip.workspace = true
rusqlite.workspace = true
assert_cmd.workspace = true
image.workspace = true
predicates.workspace = true
tempfile.workspace = true
