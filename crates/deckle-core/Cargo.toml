[package]
name = "deckle-core"
description = "Deckle pipeline stages: inspect, normalize, convert, deliver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
language-tags = "0.3"
fs4 = "0.13"
deckle-kfx.workspace = true
deckle-mobi.workspace = true
deckle-transport.workspace = true
deckle-xray.workspace = true
deckle-wordwise.workspace = true
deckle-docx.workspace = true
deckle-cover.workspace = true
deckle-txt.workspace = true
deckle-fb2.workspace = true
deckle-odt.workspace = true
deckle-rtf.workspace = true
deckle-markdown.workspace = true
deckle-pdf.workspace = true
deckle-comic.workspace = true
sha2.workspace = true
md-5.workspace = true
flate2 = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
deckle-limits.workspace = true
roxmltree.workspace = true
image.workspace = true
csv.workspace = true
tempfile.workspace = true
uuid.workspace = true
# A reMarkable over SSH (fixed-layout spec §12.5): pure Rust, on `ring`, which is in the tree.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
deunicode.workspace = true
regex.workspace = true
base64.workspace = true
ureq.workspace = true
rusqlite.workspace = true

[dev-dependencies]
deckle-kfx = { workspace = true, features = ["testing"] }

[features]
# The stand-in SSH tablet of `remarkable_ssh::fake`, for other crates' tests.
fake-tablet = []
