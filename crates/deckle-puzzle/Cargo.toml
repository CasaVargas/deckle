[package]
name = "deckle-puzzle"
description = "Deckle's puzzle generators: crossword, word search, ladder, cryptogram, sudoku, nonogram and maze"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Pure Rust with no network, file or OS access, so it builds for iOS as well as the desktop
# (Deckle Puzzles roadmap, phase 0). Keep it that way: anything that reads config, fetches or
# renders belongs in deckle-digest.
[dependencies]
serde.workspace = true
rand.workspace = true
deunicode.workspace = true
flate2 = "1"
# A nonogram from a picture (PNG, JPEG, GIF or WebP); pure Rust, so it builds for iOS too.
image = { workspace = true, features = ["gif", "webp"] }
