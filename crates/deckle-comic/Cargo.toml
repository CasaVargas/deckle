[package]
name = "deckle-comic"
description = "Deckle import: a comic (CBZ or a folder of page images) to a fixed-layout EPUB 3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
deckle-limits = { workspace = true, features = ["xml"] }
thiserror.workspace = true
zip.workspace = true
sha2.workspace = true
roxmltree.workspace = true
tempfile.workspace = true
image = { workspace = true, features = ["gif"] }
# The reMarkable's image-only PDF (fixed-layout spec §12).
pdf-writer = "0.15"
flate2 = "1"
# A CBR, converted by bsdtar to a pax tar stream and read member by member (size-limits design).
tar = { version = "0.4", default-features = false }

[dev-dependencies]
deckle-kfx = { workspace = true, features = ["testing"] }
tempfile.workspace = true
roxmltree.workspace = true
zip.workspace = true
image.workspace = true
