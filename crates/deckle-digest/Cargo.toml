[package]
name = "deckle-digest"
description = "Deckle Daily: a newspaper EPUB built every morning from free sources"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
regex.workspace = true
zip.workspace = true
image = { workspace = true, features = ["gif", "webp"] }
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
feed-rs = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ab_glyph = "0.2"
html-escape = "0.2"
dom_smoothie = "0.18"
dom_query = "0.28"
url = "2"
base64.workspace = true
deunicode.workspace = true
rand.workspace = true
zeroize = "1"
# Send-to-Kindle email: SMTP over rustls only (no native-tls), no async runtime.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
rrule = "0.14.0"
flate2 = "1"
# The PDF edition (pdf edition design): a low-level writer; Deckle lays the pages out itself.
pdf-writer = "0.15"
roxmltree.workspace = true
deckle-highlights.workspace = true

# The SMTP password's keychain (email design §6): each OS's own store.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
# The PDF edition's tests read it back through PDFium.
deckle-pdf.workspace = true
zip.workspace = true
image.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
